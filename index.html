<meta name="theme-color" content="#0e1a4b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LekturoMania"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{--n:#0e1a4b;--n2:#16276b;--p:#7b4dff;--b:#4cc9f0;--w:#fff;--ok:#2fd18b;--no:#ff5d73;box-sizing:border-box;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
*{box-sizing:inherit}html,body{margin:0;min-height:100%}
body{font-family:Nunito,system-ui,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#3b2a9a,transparent),var(--n);color:var(--w);font-size:16px}
#app{max-width:760px;margin:auto;padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-weight:900;font-size:26px;cursor:pointer;letter-spacing:.5px}.logo b{color:var(--b)}
.card{background:var(--n2);border-radius:22px;padding:16px;margin:10px 0;box-shadow:0 8px 24px #0004}
h2{margin:6px 0 10px}h3{margin:12px 0 6px;color:var(--b)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font:900 17px Nunito,sans-serif;color:#fff;background:linear-gradient(135deg,var(--p),#5a8bff);cursor:pointer;margin:7px 0;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.97)}
.btn.s{background:#ffffff1c}.btn.g{background:linear-gradient(135deg,#f5b700,#ff8c1a)}.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:2px solid #ffffff33;background:none;color:#fff;border-radius:99px;padding:8px 16px;font:900 16px Nunito;cursor:pointer;transition:.2s}
.chip.on{background:var(--b);color:var(--n);border-color:var(--b);transform:scale(1.08)}
.stat{display:flex;gap:10px}.stat div{flex:1;background:#ffffff14;border-radius:16px;padding:10px;text-align:center}.stat b{display:block;font-size:22px;color:var(--b)}
.bar{height:10px;background:#ffffff22;border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--p));transition:width .5s}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:2px solid #ffffff2a;background:#ffffff0d;color:#fff;border-radius:16px;padding:12px;margin:7px 0;font:700 16px Nunito;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--b);transform:translateX(4px)}.opt span{color:var(--b);font-weight:900}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#06331f;animation:pop .4s}.opt.no{background:var(--no);border-color:var(--no);animation:shake .4s}.opt.hid{visibility:hidden}.opt.sel{background:#f5b700;color:#000;border-color:#f5b700}
@keyframes pop{50%{transform:scale(1.06)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ex{background:#ffffff14;border-left:4px solid var(--b);padding:10px;border-radius:10px;margin:8px 0}
.lad{display:flex;flex-direction:column-reverse;gap:3px;font-size:13px;font-weight:800}.lad div{padding:3px 10px;border-radius:8px;background:#ffffff12;display:flex;justify-content:space-between}.lad .cur{background:#f5b700;color:#000}.lad .safe{color:var(--b)}.lad .cur.safe{color:#000}
.fl{perspective:800px}.fc{min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:800;border-radius:22px;padding:20px;background:linear-gradient(135deg,var(--p),#3763d8);cursor:pointer;animation:pop .4s}.fc.back{background:linear-gradient(135deg,#0a8fb5,#2fd18b);color:#04202b}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--b);color:var(--n);padding:10px 20px;border-radius:99px;font-weight:900;animation:up 1.6s forwards;z-index:9}
@keyframes up{0%{opacity:0;bottom:0}15%,80%{opacity:1;bottom:40px}100%{opacity:0}}
input,select,textarea{width:100%;padding:11px;border-radius:12px;border:2px solid #ffffff33;background:#0e1a4b;color:#fff;font:600 16px Nunito;margin:4px 0}
.big{font-size:52px;font-weight:900;text-align:center;color:var(--b)}.mut{opacity:.75;font-size:14px}

$('#l2').onclick=()=>{u.a=1;const v=vis(),c=45+Math.random()*30|0;let r=100-c;const res={};v.filter(k=>k!=q.c).forEach((k,j,a)=>{res[k]=j==a.length-1?r:Math.floor(Math.random()*r*.6);r-=res[k]});res[q.c]=c;
$('#fb').innerHTML='<div class="ex">'+v.map(k=>`${'ABCD'[k]}: ${res[k]}%<div class="bar"><i style="width:${res[k]}%"></i></div>`).join('')+'</div>';$('#l2').disabled=1};
$('#l3').onclick=()=>{u.p=1;const v=vis(),sure=Math.random()<.8,k=sure?q.c:sh(v.filter(x=>x!=q.c))[0];$('#fb').innerHTML=`<div class="ex">📞 „Hmm… ${sure?'Prawie na pewno to':'Nie jestem pewien, ale chyba'} <b>${'ABCD'[k]}</b>.”</div>`;$('#l3').disabled=1};
const qt=$('#qt');if(qt)qt.onclick=()=>fin(L[i-1],'Odchodzisz z wygraną!')}
show()}
// ===== FISZKI =====
let fk='all',fi=0;
function fis(){const bs=B.filter(x=>inc(x)||x.k===0);if(fk!='all'&&!bs.find(x=>x.id==fk))fk='all';
const cs=bs.filter(x=>fk=='all'||x.id==fk).flatMap(x=>gq(x).map((q,j)=>({k:x.id+j,q:q[0],a:q[1][q[2]],e:q[3]})));
const kn=cs.filter(c=>S.fc[c.k]==1).length;
shell(`<h2>🃏 Fiszki</h2>${chips('fis')}<select onchange="fk=this.value;fis()"><option value="all">Wszystkie lektury klasy ${S.cl}</option>${bs.map(x=>`<option value="${x.id}" ${fk==x.id?'selected':''}>${x.t}</option>`).join('')}</select><div class="mut">Umiem: ${kn} z ${cs.length}</div><div id="fcw"></div>`);
function next(){const pool=cs.filter(c=>S.fc[c.k]!=1);const l=pool.length?pool:cs;const c=l[Math.floor(Math.random()*l.length)];let back=0;
const r=()=>{$('#fcw').innerHTML=`<div class="fc ${back?'back':''}" id="cd">${back?c.a+'<br><small>'+c.e+'</small>':c.q}</div><div class="mut" style="text-align:center">Kliknij kartę, aby ją odwrócić</div>${back?'<div class="grid"><button class="btn" id="u1">✅ Umiem</button><button class="btn s" id="u0">🔁 Muszę powtórzyć</button></div>':''}`;
$('#cd').onclick=()=>{back=!back;snd(500,.08);r()};if(back){$('#u1').onclick=()=>{S.fc[c.k]=1;xp(2);fis()};$('#u0').onclick=()=>{S.fc[c.k]=0;sv();fis()}}};r()}
if(cs.length)next();else $('#fcw').innerHTML='Brak fiszek.'}
// ===== POSTĘPY =====
function prog(){const avg=S.hs.n?Math.round(S.hs.p/S.hs.n):0;
shell(`<h2>📈 Moje postępy</h2><div class="card"><div class="stat"><div><b>${S.xp}</b>XP</div><div><b>${lvl()}</b>Poziom</div><div><b>🔥${S.st}</b>Seria dni</div></div>
<div class="bar"><i style="width:${S.xp%100}%"></i></div><p>Ukończone quizy i egzaminy: <b>${S.hs.n}</b> • średni wynik: <b>${avg}%</b></p>
<h3>Odznaki</h3>${S.b.length?S.b.map(b=>'🏅 '+b).join('<br>'):'<span class="mut">Ukończ quiz, aby zdobyć pierwszą odznakę.</span>'}</div>
<div class="card"><h3>🏆 Ranking najlepszych wyników</h3>${S.rk.length?S.rk.map((r,i)=>`<p>${i+1}. <b>${r.n}</b> – ${r.t} (${r.m}) ${r.t=='Milionerzy'?'':r.p+'%'}</p>`).join(''):'<span class="mut">Brak wyników.</span>'}</div>
<div class="card"><h3>➕ Dodaj własne pytanie</h3><select id="ab">${B.map(b=>`<option value="${b.id}">${b.t}</option>`).join('')}</select><input id="aq" placeholder="Pytanie"><input id="a0" placeholder="Odpowiedź A (poprawna)"><input id="a1" placeholder="Odpowiedź B"><input id="a2" placeholder="Odpowiedź C"><input id="a3" placeholder="Odpowiedź D"><input id="ae" placeholder="Wyjaśnienie">
<button class="btn" onclick="addq()">Zapisz pytanie</button><p class="mut">Nowe lektury dodasz w tablicy B na początku kodu.</p></div>
<button class="btn s" onclick="if(confirm('Usunąć cały postęp?')){localStorage.removeItem('lm');location.reload()}">Resetuj postępy</button>`)}
function addq(){const v=i=>$('#'+i).value.trim();if(!v('aq')||!v('a0')||!v('a1')||!v('a2')||!v('a3'))return toast('Uzupełnij pytanie i 4 odpowiedzi');
const id=v('ab');(S.cq[id]=S.cq[id]||[]).push([v('aq'),[v('a0'),v('a1'),v('a2'),v('a3')],0,v('ae')||'Odpowiedź dodana przez użytkownika.',2]);sv();toast('Pytanie zapisane');prog()}
home();
</script></body></html>
